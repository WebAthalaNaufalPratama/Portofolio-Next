name: Auto Create Project & Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deploy Project to Vercel (Auto Create)
        # Menambahkan parameter --name dengan huruf kecil semua (ganti 'portofolio-next' sesuai keinginan Anda)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --name=portofolio-next
