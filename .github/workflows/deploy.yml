name: Auto Create Project & Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Mengunci ke ubuntu-24.04 untuk menghindari warning imigrasi OS GitHub
    runs-on: ubuntu-24.04 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20 # Menyelaraskan lingkungan Node dengan dependensi Anda

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deploy Project to Vercel (Auto Create)
        # Menambahkan flag --yes agar Vercel otomatis membuat proyek baru tanpa bertanya di terminal
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
